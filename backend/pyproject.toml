[project]
name = "autosnab"
version = "0.1.0"
description = ""
authors = [
    { name = "Viktor Shadrin", email = "v.viktor.shadrin@gmail.com" }
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.1,<5.2)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "djangorestframework (>=3.16.0,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "xlrd (>=2.0.2,<3.0.0)",
    "pdfplumber (>=0.11.10,<0.12.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "celery (>=5.4,<6.0)",
    "redis (>=5.0,<7.0)",
    "openai (>=1.59,<2.0)",
    "instructor (>=1.7,<2.0)",
    "pydantic (>=2.10,<3.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "djangorestframework-simplejwt (>=5.3,<6.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "qdrant-client (>=1.9,<2)",
    "sentence-transformers (>=3,<6)",
    "django-storages[s3] (>=1.14.6,<2.0.0)",
    "torch (==2.13.0+cpu)",
    "cryptography (>=44,<51)",
    "httpx (>=0.28,<0.29)",
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "yandex"
url = "https://mirror.yandex.ru/pypi/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = { version = "==2.13.0+cpu", source = "pytorch-cpu" }

[tool.poetry.group.docling]
optional = true

[tool.poetry.group.docling.dependencies]
docling = ">=2.0,<3.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.14.3"
ruff = ">=0.5.0"
pre-commit = ">=4.0.0"
pytest = ">=8.0.0"
pytest-django = ">=4.8.0"
pytest-cov = ">=5.0.0"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/", "scripts/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
addopts = "--ds=config.settings"

[tool.coverage.run]
source = ["api", "catalog", "suppliers", "core", "config"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
